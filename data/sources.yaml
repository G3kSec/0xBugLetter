# 0xBugLetter — monitored sources
#
# This file is the canonical list of what is already tracked. Check it before
# proposing a new source, so we don't end up with duplicates.
#
# To add one, open a Pull Request with a new block below. CI verifies the feed
# is reachable and the schema is correct.
#
# Fields:
#   name      (required) Display name
#   url       (required) RSS/Atom feed URL — or the site URL when status is no-feed
#   site      (required) Main site URL
#   category  (required) blog | platform | researcher | podcast | news
#   status    (required) active | stale | broken | no-feed
#   verified  (required) true when the author or org is an established name
#   note      (optional) Extra context, shown on the site
#
# About `status`:
#   active   Feed works, the bot pulls from it every day.
#   stale    Feed works but the source rarely publishes.
#   broken   Feed URL fails. The bot skips it. Needs a replacement URL.
#   no-feed  Worth following, but has no usable RSS. The bot can't watch it —
#            writeups from here are added by hand.

sources:
  # ── Research & labs ─────────────────────────────────────────────────────
  - name: "PortSwigger Research"
    url: "https://portswigger.net/research/rss"
    site: "https://portswigger.net/research"
    category: blog
    status: active
    verified: true
    note: "James Kettle's team. Original research, consistently top tier."

  - name: "ProjectDiscovery"
    url: "https://projectdiscovery.io/blog/rss/"
    site: "https://projectdiscovery.io/blog"
    category: blog
    status: active
    verified: true
    note: "URL corrected — the old blog.projectdiscovery.io feed redirects here."

  - name: "Assetnote Security Research"
    url: "https://www.assetnote.io/resources/research"
    site: "https://www.assetnote.io/resources/research"
    category: blog
    status: no-feed
    verified: true
    note: >-
      Deep vulnerability research on enterprise software — the Craft CMS RCE,
      the PAN-OS auth bypass, the Next.js middleware bypass. Still publishing
      after the Searchlight Cyber acquisition, but the old RSS feed
      (blog.assetnote.io) returns 404 and no replacement feed exists. Worth
      reading anyway; writeups from here get added manually.

  - name: "Detectify Labs"
    url: "https://labs.detectify.com/feed/"
    site: "https://labs.detectify.com"
    category: blog
    status: stale
    verified: true
    note: "Feed is fine, but posts are infrequent."

  # ── Platforms ───────────────────────────────────────────────────────────
  - name: "Intigriti"
    url: "https://www.intigriti.com/blog/feed/"
    site: "https://www.intigriti.com/blog"
    category: platform
    status: active
    verified: true
    note: "URL corrected — blog.intigriti.com redirects here. Includes Bug Bytes."

  - name: "Bugcrowd Blog"
    url: "https://www.bugcrowd.com/blog/feed/"
    site: "https://www.bugcrowd.com/blog"
    category: platform
    status: broken
    verified: true
    note: >-
      Responde 200 pero devuelve HTML en vez de RSS, así que el parser saca
      cero entradas. Hace falta encontrar la URL real del feed.

  - name: "HackerOne Blog"
    url: "https://www.hackerone.com/blog.rss"
    site: "https://www.hackerone.com/blog"
    category: platform
    status: broken
    verified: true
    note: "Returns 404. Needs a replacement feed URL — good first contribution."

  # ── Podcasts ────────────────────────────────────────────────────────────
  - name: "Critical Thinking Podcast"
