    site: "https://www.criticalthinkingpodcast.io"
    category: podcast
    status: active
    verified: true
    note: "Justin Gardner (Rhynorater) and Joel Margolis (teknogeek). By hackers, for hackers."

  # ── Individual researchers ──────────────────────────────────────────────
  - name: "NahamSec"
    url: "https://www.nahamsec.com/posts?format=rss"
    site: "https://www.nahamsec.com"
