# 0xBugLetter — Fuentes monitoreadas
#
# Para agregar una fuente, abrí un Pull Request añadiendo un bloque acá.
# El CI valida que el feed sea accesible y que el schema sea correcto.
#
# Campos:
#   name      (requerido) Nombre visible de la fuente
#   url       (requerido) URL del feed RSS/Atom
#   site      (requerido) URL del sitio principal
#   category  (requerido) blog | platform | researcher | podcast | news
#   status    (requerido) active | stale | broken
#   verified  (requerido) true si la fuente es de un autor/organización reconocida
#   note      (opcional)  Contexto adicional

sources:
  # ── Investigación / Labs ────────────────────────────────────────────────
  - name: "PortSwigger Research"
    url: "https://portswigger.net/research/rss"
    site: "https://portswigger.net/research"
    category: blog
    status: active
    verified: true
    note: "El equipo de James Kettle. Research original de altísimo nivel."

