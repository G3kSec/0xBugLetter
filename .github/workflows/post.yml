name: Daily Post

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Run bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MAX_DAILY: "3"
          MAX_AGE_DAYS: "45"
        run: |
          chmod +x ./.github/scripts/start.sh
          ./.github/scripts/start.sh

      - name: Commit new archive entries
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "chore: auto-archive daily drop"
          file_pattern: data/writeups/*.yaml
          commit_user_name: G3kSec [GitHub Actions]
          commit_author: G3kSec <g3ksec@users.noreply.github.com>
