name: Validate

on:
  pull_request:
    paths:
      - "data/**"
      - "web/**"
      - ".github/scripts/validate.py"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "web/**"

jobs:
  content:
    name: Contenido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet pyyaml requests

      - name: Validate content
        run: python .github/scripts/validate.py --urls

  bot:
    name: Bot dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install deps
        run: pip install --quiet -r bot/requirements.txt

      # Exercises the real feeds and the whole selection path without a
      # webhook, so a PR that adds a source proves the bot can read it before
      # anyone merges.
      - name: Dry run
        run: python bot/index.py --dry-run

  web:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npx eslint .

      - name: Build
        working-directory: web
        run: npm run build
